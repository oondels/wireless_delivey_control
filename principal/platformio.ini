; PlatformIO — Módulo Principal
; Controle Remoto para Carrinho de Jet Ski
;
; Painel central (mestre): ESP32 WROOM-32U
; Comunicação: ESP-NOW peer-to-peer

[env:main_firmware]
platform = espressif32
monitor_port = /dev/ttyUSB1
upload_port = /dev/ttyUSB1
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:../tools/load_security_env.py
build_flags =
    -DPRINCIPAL
    -Wall
    -Wextra
    -DBYPASS_MONITOR_REDE
    ; producao por padrao; adicionar -DAPP_ENV_DEV para logs completos
