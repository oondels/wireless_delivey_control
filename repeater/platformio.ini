; PlatformIO — Módulo Repeater
; Controle Remoto para Carrinho de Jet Ski
;
; Ponte ESP-NOW entre Remote e Principal: ESP32 WROOM-32U

[env:repeater_firmware]
platform = espressif32
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:../tools/load_security_env.py
build_flags =
    -DREPEATER
    -Wall
    -Wextra
    ; producao por padrao; adicionar -DAPP_ENV_DEV para logs completos
